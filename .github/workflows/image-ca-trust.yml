name: Image CA Trust

on:
  pull_request:
    paths:
      - Dockerfile
      - .ci/verify-image-ca-trust.sh
      - hack/verify-ca-trust/**
      - .github/workflows/image-ca-trust.yml
      - .github/workflows/release-operator.yml

permissions:
  contents: read

jobs:
  image-ca-trust:
    name: Image CA Trust (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
        with:
          platforms: arm64
      - name: Run checker unit tests
        run: GOWORK=off go test ./hack/verify-ca-trust
      - name: Verify runtime trust store without network access
        env:
          PLATFORM: linux/${{ matrix.arch }}
        run: bash .ci/verify-image-ca-trust.sh
