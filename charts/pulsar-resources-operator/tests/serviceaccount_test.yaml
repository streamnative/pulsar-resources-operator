suite: test service account
templates:
  - serviceaccount.yaml
tests:
  - it: should pass all default settings
    asserts:
      - isAPIVersion:
          of: v1
      - isKind:
          of: ServiceAccount
      - matchRegex:
          path: metadata.name
          pattern: -pulsar-resources-operator$
      - notExists:
          path: automountServiceAccountToken

  - it: should omit token automount when explicitly null
    set:
      serviceAccount.automountServiceAccountToken: null
    asserts:
      - notExists:
          path: automountServiceAccountToken

  - it: should enable token automount when explicitly true
    set:
      serviceAccount.automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should disable token automount without changing service account metadata
    set:
      serviceAccount.automountServiceAccountToken: false
      serviceAccount.name: operator
      serviceAccount.annotations:
        example.com/identity: operator
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.name
          value: operator
      - equal:
          path: metadata.annotations
          value:
            example.com/identity: operator

  - it: should not create an externally managed service account
    set:
      serviceAccount.create: false
      serviceAccount.name: external-operator
      serviceAccount.automountServiceAccountToken: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should be the specified name
    set:
      serviceAccount.name: test
    asserts:
      - equal:
          path: metadata.name
          value: test
