# Default values for pulsar-resources-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Namespace for chart resources. When empty, use Helm release namespace.
namespace: ""

# -- Number of operator replicas.
replicaCount: 1

# -- Name of the operator container
containerName: manager

image:
  # -- Image pull policy for the container.
  pullPolicy: IfNotPresent
  # resource controller container
  manager:
    # -- Container image registry.
    registry: docker.io
    # -- Container image repository.
    repository: streamnative/pulsar-resources-operator
    # -- Container image tag. Defaults to chart appVersion when empty.
    tag: ""

# -- Image pull secrets for private registries, for example `- name: gcr`.
imagePullSecrets: []
# If you want to specify secrets, follow this format
# - name: test

features:
  # -- Re-apply observed managed Pulsar resources even when their Kubernetes resources are already Ready. Prefer temporary use for upgrade remediation because it increases Pulsar admin API load on reconciliations and resyncs.
  alwaysUpdatePulsarResource: false
  # -- Base informer resync period in hours.
  resyncPeriod: 10
  # -- Number of retries used by the PulsarConnection-managed resource reconciler.
  retryCount: 5
  # -- Maximum concurrent reconciles for the PulsarConnection and RoleBinding controllers. Values of 0 or 1 leave the flags unset and use the binary default.
  maxConcurrentReconciles: 1

# -- It will override the value of label `app.kubernetes.io/name` on pod
nameOverride: ""

# -- It will override the name of deployment
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. When empty and create=true, the chart generates a name.
  name: ""

# -- Add labels for the deployment
labels: {}

# -- Add annotations for the deployment
annotations: {}

# -- Add annotations for the deployment pod
podAnnotations: {}

# -- Add labels for the deployment pod
podLabels: {}

# -- Add security context for pod
podSecurityContext: {}
  # fsGroup: 2000

# -- Add security context for container
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# -- Add resource limits and requests
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Add NodeSelector for pod schedule
nodeSelector: {}

# -- Add tolerations
tolerations: []

# -- Add affinity for pod
affinity: {}

# -- Graceful termination period in seconds.
terminationGracePeriodSeconds: 10

# -- Cloud storage configuration used when downloading files for PulsarPackage resources.
cloudStorage:
  # -- AWS S3 configuration
  s3:
    # -- Enable AWS S3 support
    enabled: false
    # -- AWS region
    region: ""
    # -- AWS credentials secret configuration
    credentials:
      # -- Create a new secret for AWS credentials
      create: false
      # -- Existing secret name
      secretName: "aws-credentials"
      # -- AWS access key ID (only used if create is true)
      accessKeyId: ""
      # -- AWS secret access key (only used if create is true)
      secretAccessKey: ""

  # -- Google Cloud Storage configuration
  gcs:
    # -- Enable Google Cloud Storage support
    enabled: false
    # -- Service account configuration
    serviceAccount:
      # -- Use GCP Workload Identity (recommended for GKE)
      useWorkloadIdentity: false
      # -- GCP service account email for Workload Identity
      # Format: GSA_NAME@PROJECT_ID.iam.gserviceaccount.com
      name: ""
      # -- Service account key configuration (only used if useWorkloadIdentity is false)
      key:
        # -- Create a new secret for service account key
        create: false
        # -- Existing secret name containing the service account key
        secretName: "gcs-credentials"
        # -- Service account key JSON content (only used if create is true)
        json: ""
        # -- Mount path of the service account key file
        mountPath: "/var/secrets/google"

  # -- Azure Blob Storage configuration
  azure:
    # -- Enable Azure Blob Storage support
    enabled: false
    # -- Azure storage account name
    accountName: ""
    # -- Azure credentials configuration
    credentials:
      # -- Create a new secret for Azure credentials
      create: false
      # -- Existing secret name
      secretName: "azure-credentials"
      # -- Storage account key (only used if create is true)
      accountKey: ""
      # -- SAS token (only used if create is true)
      sasToken: ""
      # -- Use account key for authentication (if false, will use SAS token)
      useAccountKey: true

# -- Additional volume mounts for the operator container. Paths are available to file-based PulsarConnection authentication.
extraVolumeMounts: []
# -- Additional pod volumes for the operator deployment.
extraVolumes: []
